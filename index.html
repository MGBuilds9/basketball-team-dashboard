<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b12" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231d71b8'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M13 32h38M32 13c8 8 8 30 0 38M32 13c-8 8-8 30 0 38' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="An unlisted, team-first basketball command center."
    />
    <title>Basketball Team Command Center</title>
    <script>
      ;(() => {
        const saved = localStorage.getItem("basketball-dashboard-theme")
        document.documentElement.classList.add(
          saved === "light" ? "light" : "dark",
        )
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-label="Loading basketball team dashboard">
        <aside class="boot-sidebar">
          <div class="boot-shimmer boot-brand"></div>
          <div class="boot-shimmer boot-nav"></div>
          <div class="boot-shimmer boot-nav"></div>
          <div class="boot-shimmer boot-nav"></div>
          <div class="boot-shimmer boot-nav"></div>
        </aside>
        <main class="boot-main">
          <div class="boot-shimmer boot-title"></div>
          <div class="boot-grid">
            <div class="boot-shimmer boot-card"></div>
            <div class="boot-shimmer boot-card"></div>
            <div class="boot-shimmer boot-card"></div>
          </div>
          <div class="boot-shimmer boot-panel"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
