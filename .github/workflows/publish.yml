name: Publish Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_data_revision:
        description: Optional data revision that must be deployed
        required: false
        type: string
  workflow_call:
    inputs:
      expected_data_revision:
        description: Optional data revision that must be deployed
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      code_revision: ${{ steps.revisions.outputs.code_revision }}
      data_revision: ${{ steps.revisions.outputs.data_revision }}
    steps:
      - name: Check out latest application code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1

      - name: Check out latest validated data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: data
          path: data-source
          fetch-depth: 1

      - name: Resolve tested revisions
        id: revisions
        env:
          EXPECTED_DATA_REVISION: ${{ inputs.expected_data_revision }}
        run: |
          code_revision="$(git rev-parse HEAD)"
          data_revision="$(git -C data-source rev-parse HEAD)"
          if [[ -n "$EXPECTED_DATA_REVISION" && "$data_revision" != "$EXPECTED_DATA_REVISION" ]]; then
            echo "Expected data $EXPECTED_DATA_REVISION but resolved $data_revision" >&2
            exit 1
          fi
          echo "code_revision=$code_revision" >> "$GITHUB_OUTPUT"
          echo "data_revision=$data_revision" >> "$GITHUB_OUTPUT"
          mkdir -p data
          cp data-source/snapshot.json data/snapshot.json
          cp data-source/receipt.json data/receipt.json

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete release gate
        env:
          CODE_REVISION: ${{ steps.revisions.outputs.code_revision }}
          DATA_REVISION: ${{ steps.revisions.outputs.data_revision }}
        run: |
          npm run lint
          npm test
          npm run build
          npm run test:e2e

      - name: Reject a stale queued build
        env:
          TESTED_CODE_REVISION: ${{ steps.revisions.outputs.code_revision }}
          TESTED_DATA_REVISION: ${{ steps.revisions.outputs.data_revision }}
        run: |
          live_code_revision="$(git ls-remote origin refs/heads/main | cut -f1)"
          live_data_revision="$(git ls-remote origin refs/heads/data | cut -f1)"
          test "$live_code_revision" = "$TESTED_CODE_REVISION"
          test "$live_data_revision" = "$TESTED_DATA_REVISION"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload the exact tested artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
